# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-sonlh"
BBFILE_PATTERN_meta-sonlh = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-sonlh = "6"

LAYERDEPENDS_meta-sonlh = "core"
LAYERSERIES_COMPAT_meta-sonlh = "kirkstone"

WKS_FILE_PATH .= ":${LAYERDIR}/wic"
